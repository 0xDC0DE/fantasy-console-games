<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>Turtles And Hare · Little Pixel Games</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
</head>
<body>
<main class="play-page">
  <a class="back-link" href="/">All games</a>
  <h1>Turtles And Hare</h1>
  <iframe class="player" title="Turtles And Hare game" src="player/" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <section class="controls" aria-labelledby="controls-title">
    <h2 id="controls-title">Keyboard controls</h2>
    <ul class="control-list">
      <li><kbd>Arrow keys</kbd> Choose difficulty or move the cursor and selected animal</li>
      <li><kbd>X</kbd> Choose a menu tile, select an animal, or release it</li>
      <li><kbd>Z</kbd> Play the tutorial from the menu or open Quit during a puzzle</li>
      <li><kbd>X</kbd> + <kbd>Z</kbd> Reset the current puzzle</li>
    </ul>
  </section>
</main>
</body>
</html>
