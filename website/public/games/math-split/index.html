<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>Math Split · Little Pixel Games</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
</head>
<body>
<main class="play-page">
  <a class="back-link" href="/">All games</a>
  <h1>Math Split</h1>
  <iframe class="player" title="Math Split game" src="player/" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <section class="controls" aria-labelledby="controls-title">
    <h2 id="controls-title">Keyboard controls</h2>
    <ul class="control-list">
        <li><kbd>← →</kbd> Choose a level</li>
        <li><kbd>↑ ↓</kbd> Change the answer</li>
        <li><kbd>X</kbd> Start, check, or continue</li>
        <li><kbd>C</kbd> Return to menu</li>
    </ul>
  </section>
</main>
</body>
</html>
