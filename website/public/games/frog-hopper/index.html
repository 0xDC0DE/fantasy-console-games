<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>Frog Hopper · Little Pixel Games</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
</head>
<body>
<main class="play-page">
  <a class="back-link" href="/">All games</a>
  <h1>Frog Hopper</h1>
  <iframe class="player" title="Frog Hopper game" src="player/" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <section class="controls" aria-labelledby="controls-title">
    <h2 id="controls-title">Keyboard controls</h2>
    <ul class="control-list">
      <li><kbd>Up/Down</kbd> Select mode or difficulty in the menu</li>
      <li><kbd>Left/Right</kbd> Change the selected setting or choose a pebble</li>
      <li><kbd>X</kbd> Start the game or confirm a pebble</li>
      <li><kbd>Z</kbd> Return to the menu</li>
    </ul>
  </section>
</main>
</body>
</html>
