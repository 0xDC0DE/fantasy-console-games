<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>Dragon Fury · Little Pixel Games</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
</head>
<body>
<main class="play-page">
  <a class="back-link" href="/">All games</a>
  <h1>Dragon Fury</h1>
  <iframe class="player wide" title="Dragon Fury game" src="player/" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <section class="controls wide" aria-labelledby="controls-title">
    <h2 id="controls-title">Keyboard controls</h2>
    <ul class="control-list">
        <li><kbd>Z</kbd> Hold for fire breath</li>
        <li><kbd>X</kbd> Start or shoot fireballs</li>
        <li><kbd>Arrow keys</kbd> Optional: adjust speed and height</li>
    </ul>
  </section>
</main>
</body>
</html>
