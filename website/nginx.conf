server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
